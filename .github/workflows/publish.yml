name: publish

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub often starts scheduled runs 5-20 min late
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log what would be done"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # approval time is read from git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-publish.txt

      - name: Publish due items
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/publish.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit state changes
        run: |
          git add -A queue published docs/media
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "publish: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
